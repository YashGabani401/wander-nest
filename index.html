<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WanderNest</title>
    <!-- ===== custom stylesheet ===== -->
    <link rel="stylesheet" href="./assets/css/common.css">

                        <!-- ===== plugins ===== -->
    <!-- ===== bootstrap ===== -->
    <link rel="stylesheet" href="./assets/plugins/bootstrap/css/bootstrap.min.css">

    <!-- ===== slick slider ===== -->
    <link rel="stylesheet" href="./assets/plugins/sliders/slick/css/slick.min.css">
    <link rel="stylesheet" href="./assets/plugins/sliders/slick/css/slick-theme.min.css">

    <!-- ===== swiper slider ===== -->
    <link rel="stylesheet" href="./assets/plugins/sliders/swiper/swiper-bundle.min.css" />

    <!-- ===== wow ===== -->
    <link rel="stylesheet" href="./assets/plugins/wow/css/animate.min.css">

    <!-- ===== fancybox ===== --> 
    <link rel="stylesheet" href="./assets/plugins/fancybox/css/jquery.fancybox.min.css" />

    <!-- ===== font-awesome icons ===== -->
     <link rel="stylesheet" href="./assets/plugins/fontawesome/css/all.min.css">
  </head>
  <body>
                        <!-- ===== plugins ===== -->
    <!-- ===== bootstrap ===== -->
    <script src="./assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- ===== slick slider ===== -->
    <script src="./assets/plugins/sliders/slick/js/jquery.min.js"></script>
    <script src="./assets/plugins/sliders/slick/js/slick.min.js"></script>

    <!-- ===== swiper slider ===== -->
    <script src="./assets/plugins/sliders/swiper/swiper-bundle.min.js"></script>

    <!-- ===== wow ===== -->
    <script src="./assets/plugins/wow/js/wow.min.js"></script>

    <!-- ===== counter ===== -->
    <script src="./assets/plugins/counter/counterup2.min.js"></script>

    <!-- ===== fancybox ===== -->
    <script src="./assets/plugins/fancybox/js/jquery.fancybox.min.js"></script>

    <!-- ===== panzoom ===== -->
    <script src="./assets/plugins/panzoom/panzoom.min.js"></script>

    <!-- ===== LOGIC RUNTIME INITIALIZATIONS ===== -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        
        // A. Run WOW Animations
        try {
          new WOW({ boxClass: 'wow', animateClass: 'animate__animated', offset: 60 }).init();
        } catch(e) { console.error("WOW failed:", e); }

        // B. Run Counter-Up Progress Numbers
        const counters = document.querySelectorAll('.counter');
        const counterUpFn = window.counterUp?.default || window.counterUp;
        if (counterUpFn) {
          const countObserver = new IntersectionObserver(entries => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                counterUpFn(entry.target, { duration: 2000, delay: 16 });
                countObserver.unobserve(entry.target);
              }
            });
          }, { threshold: 0.1 });
          counters.forEach(c => countObserver.observe(c));
        }

        // C. Run Slick Carousel Framework
        try {
          $('.slick-test-carousel').slick({ infinite: true, slidesToShow: 2, slidesToScroll: 1, autoplay: true, autoplaySpeed: 2500 });
        } catch(e) { console.error("Slick Slider failed:", e); }

        // D. Run Swiper Slider Engine
        try {
          new Swiper('.swiper-test-carousel', { loop: true, autoplay: { delay: 2500 } });
        } catch(e) { console.error("Swiper failed:", e); }

        // E. Run Fancybox v3 Window Hooks
        try {
          $('[data-fancybox]').fancybox({ 
            src: '#inline-popup-content',
            type: 'inline',
            buttons: ["close"] 
          });
        } catch(e) { console.error("Fancybox failed:", e); }

        // F. Run Standalone Panzoom Controls
        try {
          const panElement = document.getElementById('panzoomTarget');
          const panWrapper = document.getElementById('panzoomContainer');
          const PanzoomEngine = window.Panzoom?.default || window.Panzoom;
          
          if (PanzoomEngine && panElement) {
            const panInstance = PanzoomEngine(panElement, { maxScale: 5 });
            panWrapper.addEventListener('wheel', (e) => {
              e.preventDefault();
              panInstance.zoomWithWheel(e);
            }, { passive: false });
          }
        } catch(e) { console.error("Panzoom failed:", e); }

      });
    </script>
    
  </body>
</html>
